livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
unifiedpush-connector = { group = "org.unifiedpush.android", name = "connector", version.ref = "unifiedpushConnector" }
unifiedpush-fcm = { group = "org.unifiedpush.android", name = "embedded-fcm-distributor", version.ref = "unifiedpushFcm" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
