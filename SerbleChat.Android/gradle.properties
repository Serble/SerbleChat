org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app finds the Serble Chat backend and friends. Debug and preview builds use the debug
# values: 10.0.2.2 is the host machine's loopback from inside the emulator. Override any of them on
# the command line, e.g. -PserbleChat.debugApiUrl=http://192.168.1.20:5210 for a phone on the LAN.
serbleChat.apiUrl=https://api.chat.serble.net
serbleChat.liveKitUrl=wss://ws.chat.serble.net
serbleChat.frontendUrl=https://chat.serble.net
serbleChat.s3Url=https://s3.serble.net/serblechat-images
serbleChat.filesApiUrl=https://api.files.serble.net
serbleChat.debugApiUrl=http://10.0.2.2:5210
serbleChat.debugLiveKitUrl=ws://10.0.2.2:7880
serbleChat.debugFrontendUrl=http://localhost:5173
serbleChat.debugS3Url=https://s3.serble.net/serblechat-images
serbleChat.debugFilesApiUrl=https://api.files.serble.net
# Serble OAuth app. Add serblechat://auth/callback to its redirect URLs.
serbleChat.oauthClientId=1ebf51ca-9eae-46ad-aa98-b984c47ad94d
